<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brushing Fun</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<style>
body { margin:0; background:black; overflow:hidden; }
video { width:100vw; height:100vh; object-fit:cover; }
#startBtn { position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); font-size:24px; padding:15px 25px; z-index:20; }
.balloon { position: fixed; width: 160px; height: 200px; border-radius: 50%; transform: translate(-50%, -50%) scale(0.3); z-index:9999; }
.surprise { position: fixed; font-size:70px; z-index:9999; }
.firework { position: fixed; width:6px; height:6px; border-radius:50%; z-index:9999; }
</style>
</head>
<body>
<video id="video" autoplay playsinline></video>
<button id="startBtn">START</button>
<script>
const video=document.getElementById('video');
const startBtn=document.getElementById('startBtn');

let balloon=null, balloonState=null;
let baseline=null, widthBaseline=null;
let openSmoother=0, lastFireworkTime=0;
let cumulativeOpenTime=0;
let lastFrameTime=null;

const OPEN_DELTA=0.012;
const BALLOON_POP_TIME=5000; // 5 seconds cumulative open
const CLOSE_HOLD=300; // 0.3s to reset cumulative if fully closed
const colors=["red","blue","yellow","green","purple","orange","pink"];
const surprises=["🐶","🐱","🦁","🐼","🐸","🚗","🚕","🚜","🚀","✈️"];

startBtn.onclick=async()=>{
  startBtn.style.display="none";
  const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}});
  video.srcObject=stream;
  video.play();
  startFaceMesh();
};

function createBalloon(x,y){
  if(balloon) return;
  balloon=document.createElement('div');
  balloon.className='balloon';
  balloon.style.background=colors[Math.floor(Math.random()*colors.length)];
  document.body.appendChild(balloon);
  balloonState={x:x, y:y-220, scale:0.3, angle:0};
}

function popBalloon(){
  if(!balloon) return;
  // Emoji appears once
  const surpriseEl=document.createElement('div');
  surpriseEl.className='surprise';
  surpriseEl.innerText=surprises[Math.floor(Math.random()*surprises.length)];
  surpriseEl.style.left=balloonState.x+'px';
  surpriseEl.style.top=(balloonState.y-100)+'px';
  document.body.appendChild(surpriseEl);

  createFireworkBurst(balloonState.x, balloonState.y);

  balloon.remove();
  balloon=null;
  balloonState=null;
  cumulativeOpenTime=0;

  setTimeout(()=>{ surpriseEl.remove(); },1000);
}

function createFireworkBurst(x,y){
  for(let i=0;i<20;i++){
    const fw=document.createElement('div');
    fw.className='firework';
    fw.style.left=x+'px';
    fw.style.top=y+'px';
    fw.style.background=colors[Math.floor(Math.random()*colors.length)];
    document.body.appendChild(fw);
    const angle=Math.random()*2*Math.PI;
    const dist=80+Math.random()*80;
    fw.animate([{transform:'translate(0,0)',opacity:1},{transform:`translate(${Math.cos(angle)*dist}px,${Math.sin(angle)*dist}px)`,opacity:0}],{duration:800});
    setTimeout(()=>fw.remove(),800);
  }
}

function startFaceMesh(){
  const faceMesh=new FaceMesh({locateFile:(file)=>`https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`});
  faceMesh.setOptions({maxNumFaces:3,refineLandmarks:true});
  faceMesh.onResults(results=>{
    if(!results.multiFaceLandmarks || results.multiFaceLandmarks.length===0) return;

    const now=Date.now();
    if(lastFrameTime===null) lastFrameTime=now;
    const dt=now-lastFrameTime; // milliseconds since last frame
    lastFrameTime=now;

    let face=results.multiFaceLandmarks[0];
    let best=Infinity;
    results.multiFaceLandmarks.forEach(f=>{
      let cx=(f[13].x+f[14].x)/2;
      let cy=(f[13].y+f[14].y)/2;
      let dist=Math.abs(cx-0.5)+Math.abs(cy-0.5);
      if(dist<best){best=dist; face=f;}
    });

    const upper=face[13], lower=face[14];
    const left=face[61], right=face[291];
    const mouthHeight=Math.abs(upper.y-lower.y);
    const mouthWidth=Math.abs(left.x-right.x);
    const rect=video.getBoundingClientRect();
    const x=rect.left+upper.x*rect.width;
    const y=rect.top+upper.y*rect.height;

    if(baseline===null){ baseline=mouthHeight; widthBaseline=mouthWidth; return; }
    baseline=baseline*0.9+mouthHeight*0.1;
    widthBaseline=widthBaseline*0.9+mouthWidth*0.1;

    const openThreshold=baseline+OPEN_DELTA;
    const ratio=mouthHeight/mouthWidth;
    const isOpen=(mouthHeight>openThreshold);
    const isSmile=(mouthWidth>widthBaseline*1.15 && mouthHeight<openThreshold && ratio<0.4);

    openSmoother = openSmoother*0.85 + (isOpen?1:0)*0.15;

    // create balloon if mouth opens
    if(openSmoother>0.5 && !balloon) createBalloon(x,y);

    // grow balloon if exists
    if(balloon && balloonState && openSmoother>0.5){
      balloonState.x += (x-balloonState.x)*0.2;
      balloonState.y += ((y-220)-balloonState.y)*0.2;
      balloonState.scale +=0.02;
      balloonState.angle +=0.05;
      balloon.style.left=balloonState.x+'px';
      balloon.style.top=balloonState.y+'px';
      balloon.style.transform=`translate(-50%,-50%) scale(${balloonState.scale}) rotate(${Math.sin(balloonState.angle)*10}deg)`;
      cumulativeOpenTime += dt; // add milliseconds of open
    } else {
      // if mouth mostly closed, reduce cumulativeOpenTime gradually
      cumulativeOpenTime -= dt;
      if(cumulativeOpenTime<0) cumulativeOpenTime=0;
    }

    // pop balloon after 5s cumulative open
    if(balloon && cumulativeOpenTime >= BALLOON_POP_TIME){
      popBalloon();
    }

    // fireworks for smile
    if(isSmile && Date.now()-lastFireworkTime>200){
      createFireworkBurst(x,y);
      lastFireworkTime=Date.now();
    }
  });

  new Camera(video,{onFrame: async()=>await faceMesh.send({image:video}), width:640,height:480}).start();
}
</script>
</body>
</html>
