<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brushing Balloon Fireworks</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<style>
  body { margin:0; background:black; overflow:hidden; font-family:sans-serif; }
  video { width:100vw; height:100vh; object-fit:cover; }

  #status {
    position:absolute; top:20px; left:20px; color:white;
    font-size:22px; background:rgba(0,0,0,0.5);
    padding:10px; border-radius:10px; z-index:10;
  }

  #startBtn {
    position:absolute; top:50%; left:50%; transform:translate(-50%, -50%);
    font-size:24px; padding:15px 25px; z-index:20;
  }

  .balloon {
    position: fixed;
    width: 160px;   /* doubled width */
    height: 200px;  /* doubled height */
    background-color: red;
    border-radius: 50%;
    transform: translate(-50%, -50%) scale(0.3);
    z-index: 9999;
    pointer-events:none;
  }

  .firework {
    position: fixed;
    width: 8px; height: 8px;
    border-radius: 50%;
    pointer-events: none;
    z-index:9999;
    mix-blend-mode: screen;
  }
</style>
</head>

<body>
<video id="video" autoplay playsinline></video>
<div id="status">Tap to Start</div>
<button id="startBtn">START</button>

<script>
const video = document.getElementById('video');
const statusText = document.getElementById('status');
const startBtn = document.getElementById('startBtn');

let openStart = null;
let balloon = null;
let balloonTimeout = null;
let balloonAnimation = null;
let soundEnabled = false;

const popSound = new Audio("https://actions.google.com/sounds/v1/cartoon/pop.ogg");
const colors = ["red","blue","yellow","green","purple","orange","pink"];

// START BUTTON
startBtn.onclick = async () => {
  soundEnabled = true;
  startBtn.style.display = "none";

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }});
    video.srcObject = stream;
    video.play();
    startFaceMesh();
  } catch (err) {
    statusText.innerText = "Camera blocked ❌";
    console.error(err);
  }
};

// Create balloon
function createBalloon(x, y) {
  removeBalloon();

  balloon = document.createElement('div');
  balloon.className='balloon';
  balloon.style.background = colors[Math.floor(Math.random()*colors.length)];
  document.body.appendChild(balloon);

  let scale = 0.3;
  let floatY = y - 200; // high above face
  balloonAnimation = setInterval(()=>{
    scale += 0.005;
    floatY -= 0.25;
    balloon.style.transform = `translate(-50%, -50%) scale(${scale})`;
    balloon.style.left = x+'px';
    balloon.style.top = floatY+'px';
  }, 30);

  balloonTimeout = setTimeout(()=>{
    popBalloon();
  }, 5000);
}

// Pop balloon + fireworks
function popBalloon() {
  if (!balloon) return;
  if (soundEnabled) { popSound.currentTime=0; popSound.play().catch(()=>{}); }

  const rect = balloon.getBoundingClientRect();
  createFireworks(rect.left + rect.width/2, rect.top + rect.height/2);

  removeBalloon();
}

// Fireworks effect
function createFireworks(x, y) {
  for (let i=0;i<30;i++){
    const fw = document.createElement('div');
    fw.className='firework';
    fw.style.left=x+'px';
    fw.style.top=y+'px';
    fw.style.background=colors[Math.floor(Math.random()*colors.length)];
    document.body.appendChild(fw);

    const angle = Math.random()*2*Math.PI;
    const dist = 80 + Math.random()*80;
    const dx = Math.cos(angle)*dist;
    const dy = Math.sin(angle)*dist - 50;

    fw.animate([
      { transform:'translate(0,0) scale(1)', opacity:1 },
      { transform:`translate(${dx}px,${dy}px) scale(0.5)`, opacity:0 }
    ], { duration:1200, easing:'ease-out' });

    setTimeout(()=>fw.remove(),1200);
  }
}

// Remove balloon
function removeBalloon() {
  if (balloon) { balloon.remove(); balloon=null; }
  if (balloonTimeout) { clearTimeout(balloonTimeout); balloonTimeout=null; }
  if (balloonAnimation) { clearInterval(balloonAnimation); balloonAnimation=null; }
}

// MediaPipe
function startFaceMesh() {
  const faceMesh = new FaceMesh({
    locateFile:(file)=>`https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
  });
  faceMesh.setOptions({ maxNumFaces:1, refineLandmarks:true });

  faceMesh.onResults(results=>{
    if (!results.multiFaceLandmarks) {
      statusText.innerText="Find face 👀";
      openStart=null;
      removeBalloon();
      return;
    }

    const landmarks = results.multiFaceLandmarks[0];
    const upper = landmarks[13];
    const lower = landmarks[14];
    const mouthOpen = Math.abs(upper.y-lower.y);

    const rect = video.getBoundingClientRect();
    const mouthX = rect.left + upper.x*rect.width;
    const mouthY = rect.top + upper.y*rect.height;

    if (mouthOpen>0.02) {
      statusText.innerText="OPEN 😁";
      if (!balloon) createBalloon(mouthX,mouthY);

      if (!openStart) openStart=Date.now();
    } else {
      statusText.innerText="OPEN WIDE 😄";
      openStart=null;
      removeBalloon();
    }

    if (balloon) balloon.style.left=mouthX+'px';
  });

  const camera = new Camera(video,{
    onFrame: async()=>await faceMesh.send({image:video}),
    width:640,height:480
  });
  camera.start();
}
</script>
</body>
</html>
