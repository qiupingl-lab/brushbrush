<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brushing Balloon App</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<style>
  body { margin:0; background:black; overflow:hidden; font-family:sans-serif; }
  video { width:100vw; height:100vh; object-fit:cover; }

  #status {
    position:absolute;
    top:20px;
    left:20px;
    color:white;
    font-size:22px;
    background:rgba(0,0,0,0.5);
    padding:10px;
    border-radius:10px;
    z-index:10;
  }

  #reward {
    position:absolute;
    bottom:50px;
    width:100%;
    text-align:center;
    font-size:40px;
    display:none;
    z-index:10;
  }

  #startBtn {
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    font-size:24px;
    padding:15px 25px;
    z-index:20;
  }

  .balloon {
    position: fixed;
    width: 30px;
    height: 40px;
    background: red;
    border-radius: 50% 50% 50% 50%;
    transform: translate(-50%, -50%) scale(0.2);
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
  }

</style>
</head>

<body>

<video id="video" autoplay playsinline></video>
<div id="status">Tap to Start</div>
<div id="reward">🎉 GREAT JOB! 🎉</div>
<button id="startBtn">START</button>

<script>
const video = document.getElementById('video');
const statusText = document.getElementById('status');
const reward = document.getElementById('reward');
const startBtn = document.getElementById('startBtn');

let openStart = null;
let balloon = null;
let balloonTimeout = null;

// 🎈 Pop sound (optional)
const popSound = new Audio("https://actions.google.com/sounds/v1/cartoon/pop.ogg");

// START BUTTON
startBtn.onclick = async () => {
  startBtn.style.display = "none";

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }});
    video.srcObject = stream;
    video.play();
    startFaceMesh();
  } catch (err) {
    statusText.innerText = "Camera blocked ❌";
    console.error(err);
  }
};

// Balloon animation
function createBalloon(x, y) {
  removeBalloon(); // remove existing if any

  balloon = document.createElement('div');
  balloon.className = 'balloon';
  balloon.style.left = x + "px";
  balloon.style.top = y + "px";

  document.body.appendChild(balloon);

  // Gradually grow over 5 seconds
  let scale = 0.2;
  const growthInterval = setInterval(() => {
    scale += 0.01;
    balloon.style.transform = `translate(-50%, -50%) scale(${scale})`;
  }, 50);

  // Pop after 5 seconds
  balloonTimeout = setTimeout(() => {
    clearInterval(growthInterval);
    popBalloon();
  }, 5000);
}

function popBalloon() {
  if (!balloon) return;
  popSound.currentTime = 0;
  popSound.play().catch(()=>{});
  balloon.remove();
  balloon = null;
  balloonTimeout = null;
}

function removeBalloon() {
  if (balloon) {
    balloon.remove();
    balloon = null;
  }
  if (balloonTimeout) {
    clearTimeout(balloonTimeout);
    balloonTimeout = null;
  }
}

// MediaPipe
function startFaceMesh() {
  const faceMesh = new FaceMesh({
    locateFile: (file) =>
      `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
  });

  faceMesh.setOptions({
    maxNumFaces: 1,
    refineLandmarks: true
  });

  faceMesh.onResults(results => {
    if (!results.multiFaceLandmarks) {
      statusText.innerText = "Find face 👀";
      openStart = null;
      reward.style.display = "none";
      removeBalloon();
      return;
    }

    const landmarks = results.multiFaceLandmarks[0];
    const upper = landmarks[13];
    const lower = landmarks[14];

    const mouthOpen = Math.abs(upper.y - lower.y);

    // Mouth screen position
    const rect = video.getBoundingClientRect();
    const mouthX = rect.left + upper.x * rect.width;
    const mouthY = rect.top + upper.y * rect.height;

    if (mouthOpen > 0.02) {
      statusText.innerText = "OPEN 😁";

      if (!balloon) createBalloon(mouthX, mouthY);

      if (!openStart) openStart = Date.now();
      let duration = (Date.now() - openStart) / 1000;
      if (duration > 3) reward.style.display = "block";

    } else {
      statusText.innerText = "OPEN WIDE 😄";
      openStart = null;
      reward.style.display = "none";
      removeBalloon(); // remove balloon when mouth closes
    }

    // Update balloon position if mouth moves
    if (balloon) {
      balloon.style.left = mouthX + "px";
      balloon.style.top = mouthY + "px";
    }
  });

  const camera = new Camera(video, {
    onFrame: async () => await faceMesh.send({ image: video }),
    width: 640,
    height: 480
  });
  camera.start();
}
</script>
</body>
</html>
