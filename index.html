<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brushing Multi-Balloons Fireworks</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<style>
  body { margin:0; background:black; overflow:hidden; font-family:sans-serif; }
  video { width:100vw; height:100vh; object-fit:cover; }

  #status {
    position:absolute; top:20px; left:20px; color:white;
    font-size:22px; background:rgba(0,0,0,0.5);
    padding:10px; border-radius:10px; z-index:10;
  }

  #startBtn {
    position:absolute; top:50%; left:50%; transform:translate(-50%, -50%);
    font-size:24px; padding:15px 25px; z-index:20;
  }

  .balloon {
    position: fixed;
    width: 160px;
    height: 200px;
    border-radius: 50%;
    transform: translate(-50%, -50%) scale(0.3);
    z-index: 9999;
    pointer-events:none;
  }

  .firework {
    position: fixed;
    width: 8px; height: 8px;
    border-radius: 50%;
    pointer-events: none;
    z-index:9999;
    mix-blend-mode: screen;
  }
</style>
</head>

<body>
<video id="video" autoplay playsinline></video>
<div id="status">Tap to Start</div>
<button id="startBtn">START</button>

<script>
const video = document.getElementById('video');
const statusText = document.getElementById('status');
const startBtn = document.getElementById('startBtn');

let balloons = []; // array of active balloons
let soundEnabled = false;
const popSound = new Audio("https://actions.google.com/sounds/v1/cartoon/pop.ogg");
const colors = ["red","blue","yellow","green","purple","orange","pink"];

// START BUTTON
startBtn.onclick = async () => {
  soundEnabled = true;
  startBtn.style.display = "none";

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }});
    video.srcObject = stream;
    video.play();
    startFaceMesh();
  } catch (err) {
    statusText.innerText = "Camera blocked ❌";
    console.error(err);
  }
};

// Balloon class for individual balloon behavior
class Balloon {
  constructor(x, y) {
    this.x = x;
    this.y = y - 200; // float above face
    this.scale = 0.3;
    this.angle = 0;
    this.color = colors[Math.floor(Math.random()*colors.length)];

    this.el = document.createElement('div');
    this.el.className = 'balloon';
    this.el.style.background = this.color;
    this.updatePosition();
    document.body.appendChild(this.el);

    this.animation = setInterval(()=>this.animate(), 30);
    this.timeout = setTimeout(()=>this.pop(), 5000);
  }

  animate() {
    this.scale += 0.015; // faster growth
    this.y -= 0.3; // float upward
    this.angle += 0.05;
    this.el.style.transform = `translate(-50%, -50%) scale(${this.scale}) rotate(${Math.sin(this.angle)*10}deg)`;
    this.el.style.left = this.x+'px';
    this.el.style.top = this.y+'px';
    if(this.scale > 2.5) this.pop(); // automatic pop if too big
  }

  pop() {
    if(!this.el) return;
    if(soundEnabled){ popSound.currentTime=0; popSound.play().catch(()=>{}); }
    const rect = this.el.getBoundingClientRect();
    createFireworks(rect.left + rect.width/2, rect.top + rect.height/2);
    clearInterval(this.animation);
    clearTimeout(this.timeout);
    this.el.remove();
    balloons = balloons.filter(b=>b!==this);
  }

  updatePosition() {
    this.el.style.left = this.x+'px';
    this.el.style.top = this.y+'px';
  }
}

// Fireworks effect
function createFireworks(x, y) {
  for(let i=0;i<50;i++){
    const fw = document.createElement('div');
    fw.className='firework';
    fw.style.left=x+'px';
    fw.style.top=y+'px';
    fw.style.background=colors[Math.floor(Math.random()*colors.length)];
    document.body.appendChild(fw);

    const angle = Math.random()*2*Math.PI;
    const dist = 100 + Math.random()*100;
    const dx = Math.cos(angle)*dist;
    const dy = Math.sin(angle)*dist - 50;

    fw.animate([
      { transform:'translate(0,0) scale(1)', opacity:1 },
      { transform:`translate(${dx}px,${dy}px) scale(0.5)`, opacity:0 }
    ], { duration:1500, easing:'ease-out' });

    setTimeout(()=>fw.remove(),1500);
  }
}

// MediaPipe FaceMesh
function startFaceMesh() {
  const faceMesh = new FaceMesh({
    locateFile:(file)=>`https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
  });
  faceMesh.setOptions({ maxNumFaces:1, refineLandmarks:true });

  let mouthClosed = true;

  faceMesh.onResults(results=>{
    if (!results.multiFaceLandmarks) {
      statusText.innerText="Find face 👀";
      return;
    }

    const landmarks = results.multiFaceLandmarks[0];
    const upper = landmarks[13];
    const lower = landmarks[14];
    const mouthOpen = Math.abs(upper.y-lower.y);

    const rect = video.getBoundingClientRect();
    const mouthX = rect.left + upper.x*rect.width;
    const mouthY = rect.top + upper.y*rect.height;

    if(mouthOpen>0.02){
      statusText.innerText="OPEN 😁";
      // spawn a new balloon every 1.2s while mouth is open
      if(mouthClosed || balloons.length===0){
        balloons.push(new Balloon(mouthX, mouthY));
      }
      mouthClosed=false;
    }else{
      statusText.innerText="OPEN WIDE 😄";
      mouthClosed=true;
    }
  });

  const camera = new Camera(video,{
    onFrame: async()=>await faceMesh.send({image:video}),
    width:640,height:480
  });
  camera.start();
}
</script>
</body>
</html>
