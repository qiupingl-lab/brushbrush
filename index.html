<!DOCTYPE html>
<html>
  <div id="status">NEW VERSION LOADED 🚀</div>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brushing Helper</title>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

  <style>
    body { margin:0; background:black; overflow:hidden; font-family:sans-serif; }
    video { width:100vw; height:100vh; object-fit:cover; }

    #status {
      position:absolute;
      top:20px;
      left:20px;
      color:white;
      font-size:22px;
      background:rgba(0,0,0,0.5);
      padding:10px;
      border-radius:10px;
    }

    #reward {
      position:absolute;
      bottom:50px;
      width:100%;
      text-align:center;
      font-size:40px;
      display:none;
    }

    #stars {
      position:absolute;
      pointer-events:none;
    }

    .star {
      position:absolute;
      font-size:20px;
      animation: explode 0.8s ease-out forwards;
    }

    @keyframes explode {
      from {
        transform: translate(0,0) scale(1);
        opacity: 1;
      }
      to {
        transform: translate(var(--x), var(--y)) scale(0.5);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

<video id="video" autoplay playsinline></video>
<div id="status">Loading...</div>
<div id="reward">🎉 GREAT JOB! 🎉</div>
<div id="stars"></div>

<script>
const video = document.getElementById('video');
const statusText = document.getElementById('status');
const reward = document.getElementById('reward');
const starsContainer = document.getElementById('stars');

// 🔊 Simple pop sound (base64 so no file needed)
const popSound = new Audio("data:audio/mp3;base64,//uQZAAAAAAAAAAAAAAAAAAAA..."); // short sound placeholder

let openStart = null;
let lastStarTime = 0;

// ⭐ Spawn stars at mouth position
function spawnStars(x, y) {
  const now = Date.now();

  // limit frequency
  if (now - lastStarTime < 200) return;
  lastStarTime = now;

  popSound.currentTime = 0;
  popSound.play().catch(()=>{});

  for (let i = 0; i < 8; i++) {
    const star = document.createElement("div");
    star.className = "star";
    star.innerText = "⭐";

    star.style.left = x + "px";
    star.style.top = y + "px";

    const dx = (Math.random() - 0.5) * 200 + "px";
    const dy = (Math.random() - 0.5) * 200 + "px";

    star.style.setProperty('--x', dx);
    star.style.setProperty('--y', dy);

    starsContainer.appendChild(star);

    setTimeout(() => star.remove(), 800);
  }
}

// Start camera
navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
.then(stream => {
  video.srcObject = stream;
  video.play();
  startFaceMesh();
})
.catch(() => {
  statusText.innerText = "Camera blocked ❌";
});

// MediaPipe
function startFaceMesh() {
  const faceMesh = new FaceMesh({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
  });

  faceMesh.setOptions({
    maxNumFaces: 1,
    refineLandmarks: true
  });

  faceMesh.onResults(results => {
    if (!results.multiFaceLandmarks) {
      statusText.innerText = "Find face 👀";
      openStart = null;
      reward.style.display = "none";
      return;
    }

    const landmarks = results.multiFaceLandmarks[0];

    const upper = landmarks[13];
    const lower = landmarks[14];

    const mouthOpen = Math.abs(upper.y - lower.y);

    // 👇 Convert to screen position
    const mouthX = upper.x * window.innerWidth;
    const mouthY = upper.y * window.innerHeight;

    if (mouthOpen > 0.02) {
      statusText.innerText = "OPEN 😁";

      spawnStars(mouthX, mouthY);

      if (!openStart) openStart = Date.now();

      let duration = (Date.now() - openStart) / 1000;

      if (duration > 3) {
        reward.style.display = "block";
      }

    } else {
      statusText.innerText = "OPEN WIDE 😄";
      openStart = null;
      reward.style.display = "none";
    }
  });

  const camera = new Camera(video, {
    onFrame: async () => {
      await faceMesh.send({ image: video });
    },
    width: 640,
    height: 480
  });

  camera.start();
}
</script>

</body>
</html>
