<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brushing Helper</title>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

  <style>
    body { margin:0; background:black; overflow:hidden; font-family:sans-serif; }
    video { width:100vw; height:100vh; object-fit:cover; }

    #status {
      position:absolute;
      top:20px;
      left:20px;
      color:white;
      font-size:22px;
      background:rgba(0,0,0,0.5);
      padding:10px;
      border-radius:10px;
      z-index:10;
    }

    #reward {
      position:absolute;
      bottom:50px;
      width:100%;
      text-align:center;
      font-size:40px;
      display:none;
      z-index:10;
    }

    #startBtn {
      position:absolute;
      top:50%;
      left:50%;
      transform:translate(-50%, -50%);
      font-size:24px;
      padding:15px 25px;
      z-index:20;
    }
  </style>
</head>

<body>

<video id="video" autoplay playsinline></video>
<div id="status">Tap to Start</div>
<div id="reward">🎉 GREAT JOB! 🎉</div>
<button id="startBtn">START</button>

<script>
const video = document.getElementById('video');
const statusText = document.getElementById('status');
const reward = document.getElementById('reward');
const startBtn = document.getElementById('startBtn');

let openStart = null;
let soundEnabled = false;

// 🔊 simple sound
const popSound = new Audio("https://actions.google.com/sounds/v1/cartoon/pop.ogg");

// ⭐ STAR FUNCTION (FIXED)
function spawnStars(x, y) {
  console.log("SPAWN", x, y);

  for (let i = 0; i < 10; i++) {
    const star = document.createElement("div");
    star.innerText = "⭐";

    star.style.position = "fixed";
    star.style.left = x + "px";
    star.style.top = y + "px";
    star.style.fontSize = "24px";
    star.style.zIndex = "9999";

    const dx = (Math.random() - 0.5) * 150;
    const dy = (Math.random() - 0.5) * 150;

    star.animate([
      { transform: "translate(0,0)", opacity: 1 },
      { transform: `translate(${dx}px, ${dy}px)`, opacity: 0 }
    ], {
      duration: 800,
      easing: "ease-out"
    });

    document.body.appendChild(star);
    setTimeout(() => star.remove(), 800);
  }

  if (soundEnabled) {
    popSound.currentTime = 0;
    popSound.play().catch(()=>{});
  }
}

// START BUTTON (required for sound + camera)
startBtn.onclick = async () => {
  soundEnabled = true;
  startBtn.style.display = "none";

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user" }
    });

    video.srcObject = stream;
    video.play();
    startFaceMesh();

  } catch (err) {
    statusText.innerText = "Camera blocked ❌";
    console.error(err);
  }
};

// MediaPipe
function startFaceMesh() {
  const faceMesh = new FaceMesh({
    locateFile: (file) =>
      `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
  });

  faceMesh.setOptions({
    maxNumFaces: 1,
    refineLandmarks: true
  });

  faceMesh.onResults(results => {
    if (!results.multiFaceLandmarks) {
      statusText.innerText = "Find face 👀";
      openStart = null;
      reward.style.display = "none";
      return;
    }

    const landmarks = results.multiFaceLandmarks[0];
    const upper = landmarks[13];
    const lower = landmarks[14];

    const mouthOpen = Math.abs(upper.y - lower.y);

    // ✅ Correct position mapping
    const rect = video.getBoundingClientRect();
    const mouthX = rect.left + upper.x * rect.width;
    const mouthY = rect.top + upper.y * rect.height;

    if (mouthOpen > 0.02) {
      statusText.innerText = "OPEN 😁";

      spawnStars(mouthX, mouthY);

      if (!openStart) openStart = Date.now();
      let duration = (Date.now() - openStart) / 1000;

      if (duration > 3) {
        reward.style.display = "block";
      }

    } else {
      statusText.innerText = "OPEN WIDE 😄";
      openStart = null;
      reward.style.display = "none";
    }
  });

  const camera = new Camera(video, {
    onFrame: async () => {
      await faceMesh.send({ image: video });
    },
    width: 640,
    height: 480
  });

  camera.start();
}
</script>

</body>
</html>
