<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brushing Balloon Fun</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<style>
  body { margin:0; background:black; overflow:hidden; font-family:sans-serif; }
  video { width:100vw; height:100vh; object-fit:cover; }

  #status {
    position:absolute; top:20px; left:20px; color:white;
    font-size:22px; background:rgba(0,0,0,0.5);
    padding:10px; border-radius:10px; z-index:10;
  }

  #reward {
    position:absolute; bottom:50px; width:100%; text-align:center;
    font-size:40px; display:none; z-index:10;
  }

  #startBtn {
    position:absolute; top:50%; left:50%; transform:translate(-50%, -50%);
    font-size:24px; padding:15px 25px; z-index:20;
  }

  .balloon {
    position: fixed;
    width: 30px; height: 40px;
    border-radius: 50% 50% 50% 50%;
    transform: translate(-50%, -50%) scale(0.2);
    display: flex; align-items: center; justify-content: center;
    z-index: 9999;
  }

  .confetti {
    position: fixed;
    width: 8px; height: 8px;
    border-radius: 50%;
    z-index: 9999;
    pointer-events: none;
  }
</style>
</head>

<body>
<video id="video" autoplay playsinline></video>
<div id="status">Tap to Start</div>
<div id="reward">🎉 GREAT JOB! 🎉</div>
<button id="startBtn">START</button>

<script>
const video = document.getElementById('video');
const statusText = document.getElementById('status');
const reward = document.getElementById('reward');
const startBtn = document.getElementById('startBtn');

let openStart = null;
let balloon = null;
let balloonTimeout = null;
let soundEnabled = false;

// 🎈 Pop sound
const popSound = new Audio("https://actions.google.com/sounds/v1/cartoon/pop.ogg");

// Random balloon colors
const colors = ["red","blue","yellow","green","purple","orange","pink"];

// START BUTTON
startBtn.onclick = async () => {
  soundEnabled = true;
  startBtn.style.display = "none";

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }});
    video.srcObject = stream;
    video.play();
    startFaceMesh();
  } catch (err) {
    statusText.innerText = "Camera blocked ❌";
    console.error(err);
  }
};

// Balloon creation
function createBalloon(x, y) {
  removeBalloon();

  balloon = document.createElement('div');
  balloon.className = 'balloon';
  balloon.style.left = x + "px";
  balloon.style.top = (y - 50) + "px"; // above mouth
  balloon.style.background = colors[Math.floor(Math.random()*colors.length)];
  document.body.appendChild(balloon);

  let scale = 0.2;
  const growthInterval = setInterval(() => {
    if (!balloon) return;
    scale += 0.01;
    balloon.style.transform = `translate(-50%, -50%) scale(${scale})`;
  }, 50);

  balloonTimeout = setTimeout(() => {
    clearInterval(growthInterval);
    popBalloon();
  }, 5000);
}

// Pop balloon with confetti
function popBalloon() {
  if (!balloon) return;
  if (soundEnabled) {
    popSound.currentTime = 0;
    popSound.play().catch(()=>{});
  }

  const rect = balloon.getBoundingClientRect();
  createConfetti(rect.left + rect.width/2, rect.top + rect.height/2);

  balloon.remove();
  balloon = null;
  balloonTimeout = null;
}

// Confetti particles
function createConfetti(x, y) {
  for (let i=0;i<20;i++) {
    const conf = document.createElement('div');
    conf.className='confetti';
    conf.style.left=x+'px';
    conf.style.top=y+'px';
    conf.style.background=colors[Math.floor(Math.random()*colors.length)];
    document.body.appendChild(conf);

    const dx=(Math.random()-0.5)*200;
    const dy=(Math.random()-0.5)*200;
    const rot=Math.random()*360;

    conf.animate([
      { transform:`translate(0,0) rotate(0deg)`, opacity:1},
      { transform:`translate(${dx}px,${dy}px) rotate(${rot}deg)`, opacity:0 }
    ], { duration:1000, easing:'ease-out'});

    setTimeout(()=>conf.remove(),1000);
  }
}

// Remove balloon if mouth closes
function removeBalloon() {
  if (balloon) { balloon.remove(); balloon=null; }
  if (balloonTimeout) { clearTimeout(balloonTimeout); balloonTimeout=null; }
}

// MediaPipe
function startFaceMesh() {
  const faceMesh = new FaceMesh({
    locateFile: (file) =>
      `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
  });

  faceMesh.setOptions({ maxNumFaces:1, refineLandmarks:true });

  faceMesh.onResults(results => {
    if (!results.multiFaceLandmarks) {
      statusText.innerText="Find face 👀";
      openStart=null;
      reward.style.display="none";
      removeBalloon();
      return;
    }

    const landmarks = results.multiFaceLandmarks[0];
    const upper = landmarks[13];
    const lower = landmarks[14];
    const mouthOpen = Math.abs(upper.y-lower.y);

    const rect = video.getBoundingClientRect();
    const mouthX = rect.left + upper.x*rect.width;
    const mouthY = rect.top + upper.y*rect.height;

    if (mouthOpen>0.02) {
      statusText.innerText="OPEN 😁";
      if (!balloon) createBalloon(mouthX,mouthY);

      if (!openStart) openStart=Date.now();
      if ((Date.now()-openStart)/1000>3) reward.style.display="block";
    } else {
      statusText.innerText="OPEN WIDE 😄";
      openStart=null;
      reward.style.display="none";
      removeBalloon();
    }

    // Move balloon smoothly
    if (balloon) {
      balloon.style.left = mouthX + 'px';
      balloon.style.top = (mouthY - 50) + 'px';
    }
  });

  const camera = new Camera(video,{
    onFrame: async()=>await faceMesh.send({image:video}),
    width:640, height:480
  });
  camera.start();
}
</script>
</body>
</html>
