<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brushing Fun</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<style>
body { margin:0; background:black; overflow:hidden; }
video { width:100vw; height:100vh; object-fit:cover; }

#startBtn {
  position:absolute; top:50%; left:50%;
  transform:translate(-50%, -50%);
  font-size:24px; padding:15px 25px; z-index:20;
}

.balloon {
  position: fixed;
  width: 160px;
  height: 200px;
  border-radius: 50%;
  transform: translate(-50%, -50%) scale(0.3);
  z-index: 9999;
}

.firework {
  position: fixed;
  width: 8px; height: 8px;
  border-radius: 50%;
  z-index:9999;
}

.surprise {
  position: fixed;
  font-size: 80px;
  transform: translate(-50%, -50%) scale(0);
  z-index: 9999;
}
</style>
</head>

<body>
<video id="video" autoplay playsinline></video>
<button id="startBtn">START</button>

<script>
const video = document.getElementById('video');
const startBtn = document.getElementById('startBtn');

let balloon = null;
let balloonState = null;

let baseline = null;
let openStartTime = null;
let lastPopTime = 0;

let mouthState = "closed";
let lastStateChange = 0;

const OPEN_DELTA = 0.012;
const CLOSE_DELTA = 0.006;   // lower → prevents toothbrush flicker
const HOLD_TIME = 300;
const COOLDOWN = 1200;

const popSound = new Audio("https://actions.google.com/sounds/v1/cartoon/pop.ogg");
const colors = ["red","blue","yellow","green","purple","orange","pink"];
const surprises = ["🐶","🐱","🦁","🐼","🐸","🚗","🚕","🚜","🚀","✈️"];

let soundEnabled = false;

// START
startBtn.onclick = async () => {
  soundEnabled = true;
  startBtn.style.display = "none";

  const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }});
  video.srcObject = stream;
  video.play();
  startFaceMesh();
};

// CREATE BALLOON
function createBalloon(x, y) {
  balloon = document.createElement('div');
  balloon.className='balloon';
  balloon.style.background = colors[Math.floor(Math.random()*colors.length)];
  document.body.appendChild(balloon);

  balloonState = {
    scale: 0.3,
    y: y - 220,
    x: x,
    angle: 0
  };
}

// POP
function popBalloon() {
  if(!balloon) return;

  if(soundEnabled){
    popSound.currentTime = 0;
    popSound.play().catch(()=>{});
  }

  const rect = balloon.getBoundingClientRect();
  const x = rect.left + rect.width/2;
  const y = rect.top + rect.height/2;

  createFireworks(x, y);
  createSurprise(x, y);

  balloon.remove();
  balloon = null;
  balloonState = null;
  lastPopTime = Date.now();
}

// FIREWORKS
function createFireworks(x, y) {
  for(let i=0;i<40;i++){
    const fw = document.createElement('div');
    fw.className='firework';
    fw.style.left=x+'px';
    fw.style.top=y+'px';
    fw.style.background=colors[Math.floor(Math.random()*colors.length)];
    document.body.appendChild(fw);

    const angle = Math.random()*2*Math.PI;
    const dist = 100 + Math.random()*100;

    fw.animate([
      { transform:'translate(0,0)', opacity:1 },
      { transform:`translate(${Math.cos(angle)*dist}px,${Math.sin(angle)*dist}px)`, opacity:0 }
    ], { duration:1200 });

    setTimeout(()=>fw.remove(),1200);
  }
}

// SURPRISE
function createSurprise(x, y) {
  const el = document.createElement('div');
  el.className = 'surprise';
  el.innerText = surprises[Math.floor(Math.random()*surprises.length)];
  el.style.left = x + "px";
  el.style.top = y + "px";

  document.body.appendChild(el);

  el.animate([
    { transform:'translate(-50%,-50%) scale(0)', opacity:0 },
    { transform:'translate(-50%,-50%) scale(1.4)', opacity:1 },
    { transform:'translate(-50%,-50%) scale(1)', opacity:1 }
  ], { duration:600 });

  setTimeout(()=>{
    el.animate([{opacity:1},{opacity:0}],{duration:800});
    setTimeout(()=>el.remove(),800);
  },1500);
}

// FACE MESH
function startFaceMesh() {
  const faceMesh = new FaceMesh({
    locateFile:(file)=>`https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
  });

  faceMesh.setOptions({ maxNumFaces:3, refineLandmarks:true });

  faceMesh.onResults(results=>{
    if (!results.multiFaceLandmarks || results.multiFaceLandmarks.length === 0) return;

    // pick central face
    let face = results.multiFaceLandmarks[0];
    let best = Infinity;

    results.multiFaceLandmarks.forEach(f=>{
      let cx = (f[13].x + f[14].x)/2;
      let cy = (f[13].y + f[14].y)/2;
      let dist = Math.abs(cx-0.5) + Math.abs(cy-0.5);
      if(dist < best){ best = dist; face = f; }
    });

    const upper = face[13];
    const lower = face[14];
    const mouthHeight = Math.abs(upper.y - lower.y);

    const rect = video.getBoundingClientRect();
    const x = rect.left + upper.x * rect.width;
    const y = rect.top + upper.y * rect.height;

    const now = Date.now();

    // BASELINE
    if (baseline === null) {
      baseline = mouthHeight;
      return;
    }
    baseline = baseline * 0.9 + mouthHeight * 0.1;

    const openThreshold = baseline + OPEN_DELTA;
    const closeThreshold = baseline + CLOSE_DELTA;

    // 🎯 STICKY STATE (KEY FIX)
    if (mouthState === "closed" && mouthHeight > openThreshold) {
      mouthState = "open";
      lastStateChange = now;
    }

    if (mouthState === "open" && mouthHeight < closeThreshold) {
      // must stay low for 300ms before closing
      if (now - lastStateChange > 300) {
        mouthState = "closed";
      }
    }

    // CREATE BALLOON
    if (mouthState === "open") {
      if (!openStartTime) openStartTime = now;

      const held = (now - openStartTime) > HOLD_TIME;
      const cooled = (now - lastPopTime) > COOLDOWN;

      if (!balloon && held && cooled) {
        createBalloon(x, y);
      }

    } else {
      openStartTime = null;
    }

    // 🎈 CONTROL BALLOON
    if (balloon && balloonState) {

      // smooth follow
      balloonState.x += (x - balloonState.x) * 0.2;

      // ✅ grow CONTINUOUSLY while open
      if (mouthState === "open") {
        balloonState.scale += 0.015;
        balloonState.y -= 0.3;
      }

      // wobble
      balloonState.angle += 0.05;

      balloon.style.transform =
        `translate(-50%, -50%) scale(${balloonState.scale}) rotate(${Math.sin(balloonState.angle)*10}deg)`;

      balloon.style.left = balloonState.x + "px";
      balloon.style.top = balloonState.y + "px";

      if (balloonState.scale > 2.5) {
        popBalloon();
      }
    }
  });

  new Camera(video,{
    onFrame: async()=>await faceMesh.send({image:video}),
    width:640, height:480
  }).start();
}
</script>
</body>
</html>
