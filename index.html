<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brushing Balloon Surprise</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<style>
  body { margin:0; background:black; overflow:hidden; }
  video { width:100vw; height:100vh; object-fit:cover; }

  #startBtn {
    position:absolute; top:50%; left:50%;
    transform:translate(-50%, -50%);
    font-size:24px; padding:15px 25px; z-index:20;
  }

  .balloon {
    position: fixed;
    width: 160px;
    height: 200px;
    border-radius: 50%;
    transform: translate(-50%, -50%) scale(0.3);
    z-index: 9999;
  }

  .firework {
    position: fixed;
    width: 8px; height: 8px;
    border-radius: 50%;
    z-index:9999;
  }

  .surprise {
    position: fixed;
    font-size: 80px;
    transform: translate(-50%, -50%) scale(0);
    z-index: 9999;
  }
</style>
</head>

<body>
<video id="video" autoplay playsinline></video>
<button id="startBtn">START</button>

<script>
const video = document.getElementById('video');
const startBtn = document.getElementById('startBtn');

let balloon = null;
let balloonTimeout = null;
let balloonAnimation = null;
let soundEnabled = false;
let mouthClosedSinceLastPop = true;

const popSound = new Audio("https://actions.google.com/sounds/v1/cartoon/pop.ogg");
const colors = ["red","blue","yellow","green","purple","orange","pink"];

// 🎁 Surprise pool
const surprises = [
  "🐶","🐱","🦁","🐼","🐸",
  "🚗","🚕","🚙","🚜","🚀","✈️"
];

// START
startBtn.onclick = async () => {
  soundEnabled = true;
  startBtn.style.display = "none";

  const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }});
  video.srcObject = stream;
  video.play();
  startFaceMesh();
};

// Balloon
function createBalloon(x, y) {
  removeBalloon();

  balloon = document.createElement('div');
  balloon.className='balloon';
  balloon.style.background = colors[Math.floor(Math.random()*colors.length)];
  document.body.appendChild(balloon);

  let scale = 0.3;
  let floatY = y - 200;
  let angle = 0;

  balloonAnimation = setInterval(()=>{
    scale += 0.02;
    floatY -= 0.4;
    angle += 0.05;
    balloon.style.transform =
      `translate(-50%, -50%) scale(${scale}) rotate(${Math.sin(angle)*10}deg)`;
    balloon.style.left = x+'px';
    balloon.style.top = floatY+'px';

    if(scale > 2.5) popBalloon();
  }, 30);

  balloonTimeout = setTimeout(()=> popBalloon(), 5000);
}

// POP
function popBalloon() {
  if(!balloon) return;

  if(soundEnabled){
    popSound.currentTime=0;
    popSound.play().catch(()=>{});
  }

  const rect = balloon.getBoundingClientRect();
  const x = rect.left + rect.width/2;
  const y = rect.top + rect.height/2;

  createFireworks(x,y);
  createSurprise(x,y); // 🎁 NEW

  removeBalloon();
  mouthClosedSinceLastPop = false;
}

// 🎆 Fireworks
function createFireworks(x, y) {
  for(let i=0;i<40;i++){
    const fw = document.createElement('div');
    fw.className='firework';
    fw.style.left=x+'px';
    fw.style.top=y+'px';
    fw.style.background=colors[Math.floor(Math.random()*colors.length)];
    document.body.appendChild(fw);

    const angle = Math.random()*2*Math.PI;
    const dist = 100 + Math.random()*100;
    const dx = Math.cos(angle)*dist;
    const dy = Math.sin(angle)*dist;

    fw.animate([
      { transform:'translate(0,0)', opacity:1 },
      { transform:`translate(${dx}px,${dy}px)`, opacity:0 }
    ], { duration:1200 });

    setTimeout(()=>fw.remove(),1200);
  }
}

// 🎁 Surprise reveal
function createSurprise(x, y) {
  const el = document.createElement('div');
  el.className = 'surprise';
  el.innerText = surprises[Math.floor(Math.random()*surprises.length)];
  el.style.left = x + "px";
  el.style.top = y + "px";

  document.body.appendChild(el);

  el.animate([
    { transform:'translate(-50%,-50%) scale(0)', opacity:0 },
    { transform:'translate(-50%,-50%) scale(1.4)', opacity:1 },
    { transform:'translate(-50%,-50%) scale(1)', opacity:1 }
  ], { duration:600, easing:'ease-out' });

  setTimeout(()=>{
    el.animate([
      { opacity:1 },
      { opacity:0 }
    ], { duration:800 });

    setTimeout(()=>el.remove(),800);
  }, 1500);
}

// Remove balloon
function removeBalloon() {
  if(balloon){ balloon.remove(); balloon=null; }
  if(balloonTimeout){ clearTimeout(balloonTimeout); balloonTimeout=null; }
  if(balloonAnimation){ clearInterval(balloonAnimation); balloonAnimation=null; }
}

// Face tracking
function startFaceMesh() {
  const faceMesh = new FaceMesh({
    locateFile:(file)=>`https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
  });

  faceMesh.setOptions({ maxNumFaces:1, refineLandmarks:true });

  let mouthClosed = true;

  faceMesh.onResults(results=>{
    if (!results.multiFaceLandmarks) return;

    const lm = results.multiFaceLandmarks[0];
    const mouthOpen = Math.abs(lm[13].y - lm[14].y);

    const rect = video.getBoundingClientRect();
    const x = rect.left + lm[13].x*rect.width;
    const y = rect.top + lm[13].y*rect.height;

    if(mouthOpen > 0.02){
      if(!balloon && mouthClosedSinceLastPop){
        createBalloon(x,y);
      }
      mouthClosed = false;
    } else {
      mouthClosed = true;
      mouthClosedSinceLastPop = true;
      removeBalloon();
    }

    if(balloon) balloon.style.left = x + "px";
  });

  new Camera(video,{
    onFrame: async()=>await faceMesh.send({image:video}),
    width:640, height:480
  }).start();
}
</script>
</body>
</html>
